services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio-hello
      MINIO_ROOT_PASSWORD: minio-world
    volumes:
      - ./data:/data
    command: server /data --console-address ":9001"
    networks:
      - de-streaming-network

  createbuckets:
    image: minio/mc
    container_name: createbuckets
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minio-hello minio-world;
      /usr/bin/mc mb myminio/somebucketname;
      /usr/bin/mc policy set public myminio/somebucketname;
      exit 0;
      "
    networks:
      - de-streaming-network

  de-postgres:
    image: postgres:latest
    container_name: de-streaming-database
    environment:
      POSTGRES_USER: appusr
      POSTGRES_PASSWORD: appPassword
      POSTGRES_DB: postgres
    volumes:
      - ./.scripts/postgres/data:/var/lib/postgresql/data
    ports:
      - 5431:5432
    networks:
      - de-streaming-network

networks:
  de-streaming-network:
    name: de-streaming-network
    driver: bridge